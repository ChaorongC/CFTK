[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cftk"
version = "1.0.0"
description = "cfDNA multimodal epigenetic analysis toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Chaorong Chen", email = "chaorongc@example.com" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.2",
    "pysam>=0.21",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.2",
    "adjustText>=0.8",
    "statsmodels>=0.14",
    "mesa-cfdna>=0.7.1",
]
fragmentomics = [
    "bx-python>=0.9",
    "pyBigWig>=0.3",
    "finaletoolkit>=0.9",
]
web = [
    "streamlit>=1.36",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
]

[project.scripts]
cftk = "cftk:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["analysis_workflow", "cftk", "doctor", "init", "process", "reference_profiles", "resource_planning", "run_workflow", "util", "validation_reports"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "visualization*", "report*", "cftk_registry*"]

[tool.setuptools.package-data]
cftk_registry = ["registry.json"]
